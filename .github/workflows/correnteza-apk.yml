# Compila o app Android do jogo Correnteza Abissal e publica o APK num Release.
name: APK Correnteza Abissal

on:
  push:
    paths:
      - 'Jogos/correnteza-abissal/**'
      - '.github/workflows/correnteza-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correnteza-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Jogos/correnteza-abissal/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compilar APK (release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar assinatura e metadados
        id: info
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission)" | tee badging.txt
          CERT=$(grep -m1 "SHA-256 digest" verify.txt | awk '{print $NF}')
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" = "true" ]; then echo "signing=definitiva" >> "$GITHUB_OUTPUT"; else echo "signing=temporaria" >> "$GITHUB_OUTPUT"; fi
          cp "$APK" "CorrentezaAbissal-1.0.${{ github.run_number }}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CorrentezaAbissal-apk
          path: Jogos/correnteza-abissal/android/CorrentezaAbissal-*.apk
          retention-days: 30

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="correnteza-v1.0.${{ github.run_number }}"
          if [ "${{ steps.info.outputs.signing }}" = "definitiva" ]; then
            SIGN="Assinado com a chave definitiva do projeto. Atualizações futuras instalam por cima, mantendo o progresso."
          else
            SIGN="Assinatura temporária (segredos de assinatura ainda não configurados). Instala normalmente, mas a próxima versão assinada exigirá desinstalar esta antes."
          fi
          cat > notes.md <<NOTES
          Instalador Android do jogo **Correnteza Abissal** (versão 1.0.${{ github.run_number }}).

          **Como instalar:** baixe o arquivo \`.apk\` abaixo no celular, toque nele e permita "instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.

          - Android 7.0 ou superior. Sem permissões, sem internet, sem coleta de dados.
          - ${SIGN}
          - Certificado SHA-256: \`${{ steps.info.outputs.cert }}\`
          - Commit: ${{ github.sha }}
          NOTES
          gh release create "$TAG" CorrentezaAbissal-*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Correnteza Abissal 1.0.${{ github.run_number }} (Android)" \
            --notes-file notes.md
