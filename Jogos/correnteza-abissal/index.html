<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Correnteza Abissal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<meta name="theme-color" content="#020a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
:root{
  /* Layout: app de tela única — HUD fino no topo, palco 540×900 escalado ao centro, painéis sobrepostos ao palco */
  --abyss:#020a12;
  --trench:#07202d;
  --ink:#e3f3f8;
  --mist:#8aa9b6;
  --lure:#ffc46b;
  --lure-ink:#2b1800;
  --glow:#5ef2e0;
  --danger:#ff5d73;
  --panel:rgba(5,22,32,.93);
  --veil:rgba(2,10,18,.62);
  --hair:rgba(94,242,224,.22);
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
body[data-skin="logistica"]{
  --abyss:#0c0f13;--trench:#1b2129;--ink:#eef2f5;--mist:#9aa6b2;--lure:#ffcf33;--lure-ink:#231a00;
  --glow:#7fd3ff;--panel:rgba(18,22,28,.95);--veil:rgba(8,10,13,.62);--hair:rgba(255,207,51,.24);
}
html{height:100%;box-sizing:border-box;background:var(--abyss)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--abyss);color:var(--ink);font:400 15px/1.45 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

/* HUD */
.hud{position:relative;display:flex;align-items:center;gap:12px;padding-block:8px 9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--trench),transparent)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:16px;height:16px;fill:var(--ink)}
.hud-depth{min-width:0;flex:1;display:flex;flex-direction:column}
.hud-depth b{font:800 17px/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-depth small,.hud-score small{color:var(--mist);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-score{display:flex;flex-direction:column;align-items:flex-end}
.hud-score b{font:800 17px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.lives{display:flex;gap:5px;flex:none}
.lives i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6df,var(--lure) 55%,#7a4a00);box-shadow:0 0 7px var(--lure)}
.lives i.off{background:transparent;box-shadow:none;border:1px solid var(--hair)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(127,211,255,.08)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--lure));transition:width .35s ease}
.progress.danger i{background:var(--danger)}

/* Palco */
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.banner{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner.show{opacity:1;transform:none}
.banner b{font:800 clamp(28px,8.5vw,44px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance;text-shadow:0 0 24px rgba(0,0,0,.6)}
.banner span{color:var(--mist);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);opacity:0;transition:opacity .35s ease,transform .35s ease;background:var(--panel);border:1px solid var(--lure);border-radius:16px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast small{color:var(--lure);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}
.toast b{font-weight:700}

/* Painéis */
.layer{position:absolute;inset:0;display:grid;place-items:center;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--veil);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--hair);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h2{margin:0;font:800 24px/1.15 var(--f-display);text-wrap:balance}
.card p{margin:0;color:var(--mist)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.btns{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{appearance:none;border:1px solid var(--hair);background:transparent;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;transition:transform .12s ease,background .2s ease}
.grid2 .btn{padding:11px 10px;font-size:14px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px}
.btn small{font-size:11px;font-weight:600;color:var(--mist)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--lure);color:var(--lure-ink);border-color:transparent;box-shadow:0 0 28px rgba(255,196,107,.3)}
.btn.ghost{border-color:transparent;color:var(--mist);padding-block:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.icon-btn:focus-visible,.lvl:focus-visible{outline:2px solid var(--lure);outline-offset:3px}

/* Menu */
.menu{display:grid;grid-template-columns:46px minmax(0,1fr);gap:18px}
.menu.no-gauge{grid-template-columns:minmax(0,1fr)}
.menu.no-gauge .gauge{display:none}
.gauge{position:relative;display:flex;flex-direction:column;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-left:10px;margin-bottom:8px}
.gauge::after{content:"11.000 m";position:absolute;bottom:-7px;left:6px;font-size:9.5px;font-weight:700;color:var(--mist);white-space:nowrap}
.gauge div{flex:1;position:relative;border-top:1px solid var(--hair);min-height:46px}
.gauge div::before{content:attr(data-m);position:absolute;top:-7px;left:6px;font-size:9.5px;font-weight:700;color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap}
.gauge .mark{position:absolute;left:-7px;width:13px;height:13px;border-radius:50%;background:var(--lure);box-shadow:0 0 14px var(--lure);transform:translateY(-50%);transition:top .6s ease}
.title{margin:0;font:800 clamp(30px,9.5vw,42px)/.98 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.title span{display:block;color:var(--lure)}
.menu-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.menu-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mist);font-size:13px}
.menu-foot b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Listas */
.scroll{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,520px);overflow-y:auto;padding-right:4px}
.zone-h{margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--glow)}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 12px;padding:10px 14px;border-radius:14px;border:1px solid var(--hair);background:rgba(127,211,255,.03);cursor:pointer;text-align:left}
.lvl b{font:800 14px/1.3 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl span{grid-column:1;color:var(--mist);font-size:12.5px}
.lvl em{grid-column:2;grid-row:1/span 2;font-style:normal;font-size:12px;font-weight:700;color:var(--lure);text-align:right;font-variant-numeric:tabular-nums}
.lvl[disabled]{opacity:.38;cursor:not-allowed}
.lvl[disabled] em{color:var(--mist)}
.mode{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px;border:1px solid var(--hair);border-radius:16px;background:rgba(127,211,255,.03)}
.mode b{font:800 15px var(--f-display)}
.mode span{grid-column:1;color:var(--mist);font-size:13px}
.mode span strong{color:var(--ink);font-variant-numeric:tabular-nums}
.mode .btn{grid-column:2;grid-row:1/span 2;padding:10px 18px}
.wallet{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,196,107,.07);border:1px solid var(--hair)}
.wallet span{color:var(--mist);font-weight:600}
.wallet b{font:800 20px var(--f-display);color:var(--lure);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:center;padding:12px 14px;border:1px solid var(--hair);border-radius:14px}
.item b{font-weight:700}
.item span{grid-column:1;color:var(--mist);font-size:12.5px}
.item .btn{grid-column:2;grid-row:1/span 3;padding:9px 14px;font-size:13px;white-space:nowrap}
.pips{grid-column:1;display:flex;gap:4px}
.pips i{width:20px;height:4px;border-radius:2px;background:var(--hair)}
.pips i.on{background:var(--lure)}
.ach{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid var(--hair)}
.ach i{width:28px;height:28px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;color:var(--lure-ink)}
.ach.on i{background:var(--lure);border-color:transparent}
.ach b{display:block;font-size:14px}
.ach span{color:var(--mist);font-size:12.5px}
.ach:not(.on){opacity:.62}

/* Como jogar */
.howto{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:step}
.howto li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.howto li::before{content:counter(step);counter-increment:step;font:800 12px/22px var(--f-display);text-align:center;border-radius:50%;background:rgba(127,211,255,.14);color:var(--glow);height:22px}
.powers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pw{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--mist)}
.pw b{display:block;color:var(--ink);font-size:13.5px}
.pw svg{width:30px;height:30px}

/* Resultado */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.stats div{border:1px solid var(--hair);border-radius:14px;padding:10px 12px}
.stats dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.stats dd{margin:2px 0 0;font:800 18px var(--f-display);font-variant-numeric:tabular-nums}

@media (max-width:380px){.card{padding:20px 16px}.grid2 .btn{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-skin="oceano">

    <section class="layer" id="shop" hidden>

    <section class="layer" id="achs" hidden>

    <section class="layer" id="how" hidden>

    <section class="layer" id="result" hidden>

          <button class="btn primary" id="resPrimary"></button>
          <button class="btn ghost" id="resSecondary"></button>
        </div>
      </div>
    </section>
  </main>
</div>

/* ================= Bolas e correntes ================= */
function newBall(c, s, p) { return { s, c, p: p || null, x: -99, y: -99, a: 0, chk: 0, fromShot: false, ins: null }; }

function pickAmmo() { const pc = presentColors(); return pc.length ? pc[ri(pc.length)] : ri(G.cfg.colors); }

function updateChain(ch, dt) {
  const b = ch.balls, p = ch.path;

    const s = b.length ? Math.min(b[0].s - D, 0) : 0;
    const pw = Math.random() < G.cfg.power ? POWERS[ri(POWERS.length)] : null;
    b.unshift(newBall(spawnColor(ch), s, pw)); ch.toSpawn--;
  }
  if (!b.length) return;
  const head = b[b.length - 1].s;

  if (!ch.intro) { if (G.slowT > 0) v *= .35; if (head > p.len * .82) v *= .6; }

/* ================= Disparos e bônus ================= */

function updateShots(dt) {

      for (const ch of G.chains) {

        }

/* ================= Pontos, efeitos, conquistas ================= */
function addScore(n) {

    if (G.mode !== 'relogio' && G.lives < 5) { G.lives++; floatText(G.shooter.x, G.shooter.y - 70, 'Vida extra', '#ffc46b', 20, 1.4); sfx.life(); }
  }

}

  G.pearlTimer = G.mode === 'relogio' ? rnd(8, 12) : rnd(12, 20);
  G.ammo = [ri(cfg.colors), ri(cfg.colors)];

}

  banner('Modo', mode === 'relogio' ? 'Contra o relógio' : 'Sobrevivência', mode === 'relogio' ? '2 minutos' : (G.lives === 1 ? '1 vida' : G.lives + ' vidas'));
}

}
function afterSink() {
  if (G.mode === 'relogio') {
    G.modeT = Math.max(0, G.modeT - 15);
    if (G.modeT <= 0) return endMode();
    setupBoard(modeCfg('relogio', G.cfg.layout));
    banner('Penalidade', '−15 s', 'Fila reiniciada'); return;
  }
  G.lives--; G.cleanStreak = 0; hudDirty = true;
  if (G.lives > 0) {

    banner(SK.lifeLost, G.mode === 'campanha' ? SK.lvMain(G.level, G.cfg) : 'Sobrevivência', 'Restam ' + G.lives + (G.lives === 1 ? ' vida' : ' vidas'));
    return;
  }
  if (G.mode !== 'campanha') return endMode();
  G.state = 'over';
  const earned = award((G.score - G.levelScore0) / 100);
  save.best = Math.max(save.best, G.score); persist();
  showResult({
    eyebrow: 'Fim de jogo', title: SK.loseTitle, sub: SK.loseSub(G.level, G.cfg),
    stats: statRows(earned),

    secondary: ['Menu', toMenu]

function endMode() {
  G.state = 'over'; G.shots = [];
  const earned = award(G.score / 100);
  let newRec = false, title, sub;
  if (G.mode === 'sobrevivencia') {
    const rec = save.records.surv;
    newRec = !rec || G.modeT > rec.t;
    if (newRec) save.records.surv = { t: G.modeT, score: G.score };
    title = newRec ? 'Novo recorde' : 'Fim da partida';
    sub = 'Você aguentou ' + mmss(G.modeT) + (rec && !newRec ? '. Recorde: ' + mmss(rec.t) + '.' : '.');
  } else {
    newRec = G.score > (save.records.time || 0);
    if (newRec) save.records.time = G.score;
    if (G.score >= 10000) unlock('relogio10');
    title = newRec ? 'Novo recorde' : 'Tempo esgotado';
    sub = newRec ? 'Melhor marca no Contra o relógio.' : 'Recorde: ' + fmt(save.records.time) + ' pontos.';
  }
  save.best = Math.max(save.best, G.score); persist();
  const mode = G.mode;
  showResult({

    const cfg = G.cfg || levelCfg(1), n = G.level || 1;
    let total = 0, rem = 0;
    for (const ch of G.chains) { total += ch.total; rem += ch.toSpawn + ch.balls.length; }
    prog = total ? Math.max(0, Math.min(1, 1 - rem / total)) : 0;
    main = SK.lvMain(n, cfg); zone = SK.lvZone(n, cfg).split(' · ')[0] + ' · ' + SK.lvWord + ' ' + n;
  } else if (G.mode === 'sobrevivencia') {
    main = mmss(G.modeT); zone = 'Sobrevivência · ' + G.cfg.colors + ' cores'; prog = Math.min(1, G.modeT / 150);
  } else {
    main = mmss(Math.ceil(G.modeT)); zone = 'Contra o relógio'; prog = Math.min(1, G.modeT / 120);
  }
  const lowTime = G.mode === 'relogio' && G.modeT <= 10;
  const key = [main, zone, G.score, G.lives, Math.round(prog * 100), G.danger > .82, G.mode, SKIN].join('|');
  if (key === hudCache) return; hudCache = key;
  hud.depth.textContent = main; hud.zone.textContent = zone;
  hud.depth.style.color = lowTime ? 'var(--danger)' : '';
  hud.score.textContent = fmt(G.score);
  hud.lives.hidden = G.mode === 'relogio';
  hud.lives.innerHTML = '';
  for (let i = 0; i < Math.max(G.mode === 'campanha' ? 3 : 1, G.lives); i++) { const el = document.createElement('i'); if (i >= G.lives) el.className = 'off'; hud.lives.appendChild(el); }
  hud.lives.setAttribute('aria-label', G.lives + (G.lives === 1 ? ' vida' : ' vidas'));
  hud.fill.style.width = (prog * 100).toFixed(1) + '%';
  hud.bar.classList.toggle('danger', (G.danger > .82 && G.state === 'play') || lowTime);
}
let bannerTimer = 0;
function banner(top, main, sub) {
  $('bannerTop').textContent = top; $('bannerMain').textContent = main; $('bannerSub').textContent = sub;
  const el = $('banner'); el.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function showLayer(id) { for (const el of document.querySelectorAll('.layer')) el.hidden = el.id !== id; }
function showResult(o) {
  $('resEyebrow').textContent = o.eyebrow; $('resTitle').textContent = o.title; $('resSub').textContent = o.sub;
  $('resStats').innerHTML = o.stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const p = $('resPrimary'), s = $('resSecondary');
  p.textContent = o.primary[0]; p.onclick = o.primary[1];
  s.textContent = o.secondary[0]; s.onclick = o.secondary[1];

}
function gaugeTop(d) {
  for (let i = 0; i < ZONES.length; i++) { const [, a, b] = ZONES[i]; if (d <= b) return (i + (d - a) / (b - a)) / ZONES.length * 100; }
  return 100;
}
function idleBoard() {
  G.mode = 'campanha'; G.level = 0; G.cfg = null;
  const lay = LAYOUTS.serpentina();
  G.shooter = { x: lay.shooter.x, y: lay.shooter.y, angle: -Math.PI / 2 };
  G.chains = getPaths('serpentina').map(p => ({ path: p, balls: [], toSpawn: 0, total: 0 }));
  G.shots = []; G.pearl = null; G.danger = 0;
}
function toMenu() {
  G.state = 'menu'; G.shots = [];
  if (!G.chains.length || G.mode !== 'campanha') idleBoard();
  buildBg();
  const unlocked = Math.min(save.unlocked, LEVELS.length);
  $('menuGrid').classList.toggle('no-gauge', SKIN !== 'oceano');
  $('menuEyebrow').textContent = SK.eyebrow;
  $('menuTitle').innerHTML = SK.title[0] + ' <span>' + SK.title[1] + '</span>';
  $('menuTag').textContent = SK.tag;
  $('bestScore').textContent = fmt(save.best);
  $('btnSound').textContent = 'Som: ' + (save.sound ? 'ligado' : 'desligado');
  $('btnPlay').textContent = G.resume ? SK.cont(G.resume.level) : (unlocked > 1 ? SK.playAt(unlocked) : SK.play);
  $('gaugeMark').style.top = gaugeTop(LEVELS[unlocked - 1].d) + '%';
  $('lvlCount').textContent = unlocked + ' de ' + LEVELS.length;
  $('shopCount').textContent = fmt(save.shells) + ' ' + SK.currency;
  $('achCount').textContent = Object.keys(save.ach).length + ' de ' + ACH.length;
  $('skinName').textContent = SK.label;
  showLayer('menu'); hudDirty = true; hudCache = '';
}
function buildLevelList() {
  $('lvlEyebrow').textContent = SK.lvEyebrow; $('lvlHead').textContent = SK.lvHead;
  const list = $('lvlList'); list.innerHTML = '';
  let group = '';
  LEVELS.forEach((L, i) => {
    const n = i + 1, z = SK.lvGroup(n, L);
    if (z !== group) { group = z; const h = document.createElement('div'); h.className = 'zone-h'; h.textContent = z; list.appendChild(h); }
    const open = n <= save.unlocked, best = save.lvBest[n], btn = document.createElement('button');
    btn.className = 'lvl'; btn.disabled = !open;
    const extra = getPaths(L.layout).some(p => p.tunnels.length) ? ' · túnel' : (L.layout === 'gemeas' ? ' · 2 filas' : '');
    btn.innerHTML = `<b>${SK.lvMain(n, L)}</b><span>${SK.lvWord} ${n} · ${L.colors} cores${extra}</span><em>${open ? (best ? 'Recorde<br>' + fmt(best) : 'Jogar') : 'Bloqueado'}</em>`;
    if (open) btn.onclick = () => startGame(n);

  });
}
function buildModes() {
  $('modeCampDesc').textContent = '12 fases com trilhos, túneis e filas duplas. Próxima: ' + SK.lvMain(Math.min(save.unlocked, 12), LEVELS[Math.min(save.unlocked, 12) - 1]) + '.';
  $('recSurv').textContent = save.records.surv ? mmss(save.records.surv.t) : '—';
  $('modeTimeDesc').innerHTML = '2 minutos para somar pontos. Combos e ' + SK.theBonus.toLowerCase() + ' dão tempo extra. Recorde: <strong>' + (save.records.time ? fmt(save.records.time) : '—') + '</strong>';
}
function buildShop() {
  $('wallet').textContent = fmt(save.shells); $('walletLabel').textContent = SK.Currency;
  $('shopNote').textContent = 'Você ganha ' + SK.currency + ' ao concluir fases (1 a cada 100 pontos, mais 5 por fase) e ao fim de cada partida nos modos.';
  const list = $('shopList'); list.innerHTML = '';
  for (const u of UPG) {
    const lv = upL(u.id), max = u.cost.length, done = lv >= max, cost = done ? 0 : u.cost[lv];
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<b>${u.name}</b><span>${u.label}: ${u.states[lv]}${done ? '' : ' → ' + u.states[lv + 1]}</span><div class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>`;
    const btn = document.createElement('button');
    btn.className = 'btn' + (done ? '' : ' primary');
    btn.disabled = done || save.shells < cost;
    btn.textContent = done ? 'Máximo' : fmt(cost) + ' ' + SK.currency;
    btn.onclick = () => {
      if (save.shells < cost || done) return;
      save.shells -= cost; save.up[u.id] = lv + 1; persist();
      sfx.life(); unlock('loja'); buildShop();
    };
    el.appendChild(btn); list.appendChild(el);
  }
}
function buildAch() {
  const list = $('achList'); list.innerHTML = ''; let n = 0;
  for (const [id, name, desc] of ACH) {
    const on = !!save.ach[id]; if (on) n++;
    const el = document.createElement('div'); el.className = 'ach' + (on ? ' on' : '');
    el.innerHTML = `<i>${on ? '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</i><div><b>${name}</b><span>${desc}</span></div>`;
    list.appendChild(el);
  }
  $('achSummary').textContent = n + ' de ' + ACH.length;
}
const PW_SVG = {
  slow: '<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cy="-6" r="2"/><path d="M0-4v10M-4-1h8M-6 2q1 5 6 4q5 1 6-4"/></g>',
  reverse: '<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5-3A6 6 0 1 1-2-5.6"/><path d="M-5-8l3 2.4-2.6 3"/></g>',
  burst: '<g stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M0-8v4M0 4v4M-8 0h4M4 0h4M-5.6-5.6l2.4 2.4M3.2 3.2l2.4 2.4M5.6-5.6l-2.4 2.4M-3.2 3.2l-2.4 2.4"/></g><circle r="2" fill="#fff"/>',
  aim: '<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle r="4.5"/><path d="M0-8v3M0 5v3M-8 0h3M5 0h3"/></g>'
};
function buildHow() {
  const S = SK, desc = { slow: 'Fila lenta por 6 s', reverse: 'A fila recua por 3 s', burst: 'Estoura tudo ao redor', aim: 'Mira completa e tiro rápido por 10 s' };
  $('howTitle').textContent = S.howTitle;
  $('howBody').innerHTML = `
    <ol class="howto">
      <li><span><b>Arraste</b> o dedo para mirar e <b>solte</b> para disparar. No computador, mova o mouse e clique.</span></li>
      <li><span><b>Toque ${S.onShooter}</b> para trocar ${S.theUnit} da vez pel${S.theUnit[0]} próxim${S.theUnit[0]}.</span></li>
      <li><span>Junte <b>3 ou mais</b> ${S.units} da mesma cor para estourar.</span></li>
      <li><span>Se as duas pontas de um vão tiverem a mesma cor, a fila da frente recua e se reencaixa. Cada reencaixe que estoura vira <b>combo</b>.</span></li>
      <li><span>Se ${S.aUnit} chegar ${S.toHole}, você perde uma vida. Nos <b>túneis</b> a fila passa por baixo e não pode ser atingida.</span></li>
    </ol>
    <div class="eyebrow">Especiais (anel branco)</div>
    <div class="powers">${POWERS.map(p => `<div class="pw"><svg viewBox="-12 -12 24 24"><circle r="11" fill="#103746"/>${PW_SVG[p]}</svg><span><b>${S.pw[p]}</b>${desc[p]}</span></div>`).join('')}</div>

function setSkin(name) {
  save.skin = name; persist(); SKIN = name; SK = SKINS[name];
  document.body.dataset.skin = name;
  buildSprites(); buildBg(); hudCache = ''; hudDirty = true;
}
function pause() {
  if (G.state !== 'play') return;
  G.state = 'paused';
  $('pauseTitle').textContent = G.mode === 'campanha' ? SK.lvMain(G.level, G.cfg) + ' · ' + SK.lvWord + ' ' + G.level : (G.mode === 'relogio' ? 'Contra o relógio' : 'Sobrevivência');
  $('btnRestart').textContent = G.mode === 'campanha' ? 'Reiniciar fase' : 'Reiniciar partida';
  showLayer('pause');
}
function resume() { if (G.state !== 'paused') return; showLayer(null); G.state = 'play'; last = performance.now(); }

/* ================= Entrada ================= */
function toV(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale }; }

cv.addEventListener('pointerdown', e => {
  if (G.state !== 'play') return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = toV(e);
  if (Math.hypot(p.x - G.shooter.x, p.y - G.shooter.y) < 50) { swapAmmo(); pointer.mode = 'swap'; return; }
  pointer.mode = 'aim'; aimAt(p);
});
cv.addEventListener('pointermove', e => {
  if (G.state !== 'play') return;
  const p = toV(e);
  if (e.pointerType === 'mouse') { pointer.hover = true; if (Math.hypot(p.x - G.shooter.x, p.y - G.shooter.y) >= 50) aimAt(p); }

cv.addEventListener('pointerup', e => { if (pointer.mode === 'aim' && G.state === 'play') { aimAt(toV(e)); fire(); } pointer.mode = null; });
cv.addEventListener('pointercancel', () => { pointer.mode = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointer.hover = false; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); swapAmmo(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' && G.state === 'play') { e.preventDefault(); swapAmmo(); }
  else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { G.state === 'play' ? pause() : (G.state === 'paused' && resume()); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

$('btnPause').onclick = () => (G.state === 'play' ? pause() : G.state === 'paused' ? resume() : null);
$('btnResume').onclick = resume;
$('btnRestart').onclick = () => { if (G.mode === 'campanha') { G.score = G.levelScore0; startLevel(G.level); } else startMode(G.mode); };
$('btnMenu').onclick = () => { if (G.mode === 'campanha') G.resume = { level: G.level, score: G.levelScore0, lives: G.lives }; toMenu(); };
$('btnPlay').onclick = () => { const r = G.resume; r ? startGame(r.level, r.score, r.lives) : startGame(Math.min(save.unlocked, LEVELS.length)); };
$('btnModes').onclick = () => { buildModes(); showLayer('modes'); };
$('btnLevels').onclick = () => { buildLevelList(); showLayer('levels'); };
$('btnShop').onclick = () => { buildShop(); showLayer('shop'); };
$('btnAch').onclick = () => { buildAch(); showLayer('achs'); };
$('btnHow').onclick = () => { buildHow(); showLayer('how'); };
$('btnSkin').onclick = () => { setSkin(SKIN === 'oceano' ? 'logistica' : 'oceano'); toMenu(); };
$('mCamp').onclick = () => $('btnPlay').onclick();
$('mSurv').onclick = () => startMode('sobrevivencia');
$('mTime').onclick = () => startMode('relogio');
$('btnSound').onclick = () => { save.sound = !save.sound; persist(); $('btnSound').textContent = 'Som: ' + (save.sound ? 'ligado' : 'desligado'); if (save.sound) sfx.swap(); };
for (const b of document.querySelectorAll('[data-back]')) b.onclick = toMenu;

/* ================= Início ================= */
if (location.hash === '#debug') window.__G = G;
function boot(data) {
  if (data && data.level) G.resume = { level: data.level, score: data.score || 0, lives: data.lives || 3 };
  document.body.dataset.skin = SKIN;
  idleBoard();
  resize();
  try { new ResizeObserver(resize).observe(stage); } catch (e) { addEventListener('resize', resize); }

}
try { window.claude?.hot?.snapshot?.(() => (G.mode === 'campanha' && G.level ? { level: G.level, score: G.levelScore0, lives: G.lives } : (G.resume || {}))); } catch (e) {}

hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
})();
